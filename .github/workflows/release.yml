name: Release
# Fires when a version tag is pushed (e.g. `v0.1.0`). Builds the sdist+wheel and
# publishes a GitHub Release with auto-generated notes and the artifacts attached.
# The tag IS the version (setuptools-scm) — a build here resolves to the tag exactly.
#
# Distribution is git-install-first: `pip install git+<repo>@<tag>` /
# `uv tool install git+<repo>@<tag>`. PyPI publishing is deliberately deferred (it needs
# a trusted-publisher configured out-of-band and takes on namespace/disclosure duties);
# the name `boundary-probe` is free, so it can be re-added later without churn.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload artifacts; nothing more

jobs:
  release:
    name: Build + publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED — setuptools-scm derives the version from `git
      # describe`, which needs full history + the tag. A shallow checkout yields a
      # wrong/dev version.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Sanity-check the built version matches the tag
        # Fail loudly if setuptools-scm and the tag disagree — the artifact must carry the
        # tag without its leading `v` (tag v0.1.0 -> boundary_probe-0.1.0-*.whl).
        run: |
          expected="${GITHUB_REF_NAME#v}"
          if ! ls dist/boundary_probe-"${expected}"-*.whl >/dev/null 2>&1; then
            echo "::error::built wheel does not match tag ${GITHUB_REF_NAME} (expected version ${expected})"; ls -1 dist/; exit 1
          fi
          echo "built version ${expected} matches tag ${GITHUB_REF_NAME}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "${GITHUB_REF_NAME}"
