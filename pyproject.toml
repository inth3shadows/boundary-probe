[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boundary-probe"
dynamic = ["version"]
description = "Deterministic network boundary diagnosis — pinpoints whether a connectivity failure is local, gateway, DNS, ISP, or remote service."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["networking", "diagnostics", "ping", "traceroute", "dns", "cli"]
dependencies = [
    "rich>=13.0,<15",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/inth3shadows/boundary-probe"
Repository = "https://github.com/inth3shadows/boundary-probe"
Issues = "https://github.com/inth3shadows/boundary-probe/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
boundary-probe = "boundary_probe.cli:main"

[tool.setuptools.dynamic]
# Single source of truth for the version: src/boundary_probe/__init__.py.
# setuptools reads the literal via ast (no import), so tag-time releases can
# never disagree with the installed package.
version = {attr = "boundary_probe.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: hits real network (ping/tracert/DNS). Skipped by default.",
]
addopts = "-m 'not integration'"
# Fail on leaked resources (e.g. an unclosed sqlite connection) so they cannot
# silently regress. ResourceWarnings are GC-timed and otherwise easy to miss.
filterwarnings = [
    "error::ResourceWarning",
]
